<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vista Aeropuerto - CD Lurín</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        #powerbi {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;
        }


        #estado {
            position: fixed;

            right: 15px;
            bottom: 12px;

            padding: 8px 14px;

            background: rgba(0, 0, 0, 0.78);

            color: white;

            font-family: Arial, sans-serif;
            font-size: 12px;

            border-radius: 8px;

            z-index: 99999;
        }


        .online {
            color: #55dd55;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <!-- ===================================================
         POWER BI
         =================================================== -->

    <iframe

        id="powerbi"

        src="https://app.powerbi.com/view?r=eyJrIjoiYWM1NDhhYjUtZDYxZS00YTg4LWE4ZTQtODkxMGFhNWZhZTk3IiwidCI6IjMyZTAxNzYzLTQxZTItNDA5My1hZWQ2LTVhZjFmOWMzNzk2NSJ9"

        allowfullscreen="true">

    </iframe>


    <!-- ===================================================
         ESTADO
         =================================================== -->

    <div id="estado">

        <span class="online">
            ● ONLINE
        </span>

        |

        Iniciando...

    </div>


<script>


// ==========================================================
// POWER BI
// ==========================================================

const URL_POWER_BI =
    "https://app.powerbi.com/view?r=eyJrIjoiYWM1NDhhYjUtZDYxZS00YTg4LWE4ZTQtODkxMGFhNWZhZTk3IiwidCI6IjMyZTAxNzYzLTQxZTItNDA5My1hZWQ2LTVhZjFmOWMzNzk2NSJ9";


const powerbi =
    document.getElementById("powerbi");


const estado =
    document.getElementById("estado");


// ==========================================================
// CONFIGURACIÓN
// ==========================================================

// ================================================
// CONFIGURACIÓN DE ACTUALIZACIÓN AUTOMÁTICA
// ================================================

// Cambia SOLO este número para modificar
// cada cuántos minutos se actualiza Power BI.

const INTERVALO_MINUTOS = 60;


// ==========================================================
// OBTENER HORA DE LIMA
// ==========================================================

function obtenerHoraLima() {

    const partes =

        new Intl.DateTimeFormat(

            "en-GB",

            {
                timeZone: "America/Lima",

                year: "numeric",
                month: "2-digit",
                day: "2-digit",

                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",

                hour12: false
            }

        ).formatToParts(
            new Date()
        );


    const datos = {};


    partes.forEach(

        function(parte) {

            datos[parte.type] =
                parte.value;

        }

    );


    return {

        fecha:
            datos.day +
            "/" +
            datos.month +
            "/" +
            datos.year,

        hora:
            datos.hour +
            ":" +
            datos.minute,

        horaCompleta:
            datos.hour +
            ":" +
            datos.minute +
            ":" +
            datos.second

    };

}


// ==========================================================
// ACTUALIZAR POWER BI
// ==========================================================

function actualizarPowerBI() {

    const lima =
        obtenerHoraLima();


    estado.innerHTML =

        '<span class="online">● ONLINE</span>' +

        ' | Actualizando: ' +

        lima.horaCompleta;


    console.log(
        "Actualizando Power BI:",
        lima.fecha,
        lima.horaCompleta
    );


    // ------------------------------------------------------
    // Agregamos un identificador único a la URL.
    //
    // Esto obliga al navegador a solicitar nuevamente
    // el contenido de Power BI.
    //
    // NO abre otra pestaña.
    // ------------------------------------------------------

    powerbi.src =

        URL_POWER_BI +

        "&tv_refresh=" +

        Date.now();


setTimeout(

    function() {

        estado.innerHTML =
            '<span class="online">● ONLINE</span>' +
            ' | Cada ' + INTERVALO_MINUTOS + ' min' +
            ' | Última actualización: ' +
            lima.fecha +
            ' ' +
            lima.horaCompleta;

    },

    5000

);

}


// ==========================================================
// ACTUALIZACIÓN AUTOMÁTICA
// ==========================================================

function iniciarActualizacionAutomatica() {

    estado.innerHTML =
        '<span class="online">● ONLINE</span>' +
        ' | Actualización cada ' +
        INTERVALO_MINUTOS +
        ' minutos';

    setInterval(
        actualizarPowerBI,
        INTERVALO_MINUTOS * 60 * 1000
    );
}

iniciarActualizacionAutomatica();


</script>


</body>

</html>
